<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nura walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --acc: #7A4A1C; --acc2: #B0783F; --acc3: #E5BA7E; --teal: #B0783F; --ink: #1F1B16; --ink2: #6B6158; --ink3: #9A9087; }
  html, body { margin: 0; background: #fff; overflow: hidden; }
  #stage { position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .bgfill { position: absolute; inset: 0; background: radial-gradient(120% 95% at 62% 42%, #FBF8F3 0%, #F1E9DE 100%); }
  .o { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 1px 2px rgba(20,19,22,.05), 0 18px 48px rgba(30,24,36,.09); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #cv { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; z-index: 5; pointer-events: none; }
  #heads { position: absolute; left: 120px; top: 134px; width: 1200px; z-index: 6; }
  .head { position: absolute; left: 0; top: 0; width: 1200px; }
  .head h1 { margin: 0; font: 600 46px/1.08 Inter, sans-serif; letter-spacing: -0.03em; }
  .head p { margin: 14px 0 0; font: 400 22px/1.4 Inter, sans-serif; color: var(--ink2); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.12em; margin-bottom: -0.12em; }
  .w > span { display: inline-block; }
  #rail { position: absolute; left: 120px; top: 40px; display: flex; gap: 26px; z-index: 6; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .grp > i { font: 600 12.5px/1 Inter; letter-spacing: 0.14em; color: var(--ink3); font-style: normal; padding-bottom: 9px; border-bottom: 1.5px solid rgba(122,74,28,.16); white-space: nowrap; }
  .grp > div { display: flex; gap: 8px; }
  .pill { position: relative; margin: 0; box-sizing: content-box; -webkit-appearance: none; appearance: none; height: 38px; padding: 0 17px; border-radius: 19px; background: #fff; border: 1px solid rgba(122,74,28,.18); font: 500 17px/38px Inter, sans-serif; color: #9A9087; overflow: hidden; white-space: nowrap; cursor: default; }
  .pill b { position: absolute; inset: 0; background: var(--acc); opacity: 0; }
  .pill span { position: relative; }
  .kick { display: flex; align-items: center; gap: 10px; font: 600 13px/1 Inter; letter-spacing: 0.16em; color: var(--acc); z-index: 6; }
  .kick i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; z-index: 8; opacity: 0; }
  .ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid var(--acc); opacity: 0; z-index: 8; }
  #clipFade { z-index: 9; }

  /* arch */
  .quiz { width: 720px; overflow: hidden; }
  .qbar { height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 22px; border-bottom: 1px solid #EEF0F3; }
  .qbar > i { width: 11px; height: 11px; border-radius: 50%; background: #E3E5EA; }
  .qbar > b { margin-left: 12px; font: 600 16px Inter; }
  .prog { margin-left: auto; width: 170px; height: 6px; border-radius: 3px; background: #EEF0F3; overflow: hidden; }
  .prog > em { display: block; height: 100%; background: var(--acc); transform-origin: 0 50%; transform: scaleX(0); }
  .qb { padding: 30px 40px 38px; }
  .qq + .qq { margin-top: 28px; }
  .qq > p { margin: 0 0 14px; font: 600 20px/1.25 Inter; }
  .chips { display: flex; gap: 10px; }
  .chip, .fly { position: relative; display: inline-flex; align-items: center; height: 46px; padding: 0 16px; border-radius: 23px; border: 1.5px solid #D5DAE3; background: #fff; font: 500 17px/1 Inter; color: #3B4A63; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
  .chip b { position: absolute; inset: -1.5px; background: var(--acc); opacity: 0; }
  .chip span { position: relative; }
  .fly { position: absolute; background: var(--acc); border-color: var(--acc); color: #fff; z-index: 4; }
  .prof { width: 440px; padding: 22px 30px 14px; box-sizing: border-box; }
  .cap { margin: 0 0 12px; font: 600 13px/1 Inter; letter-spacing: 0.14em; color: var(--ink3); }
  .pr { position: relative; display: flex; align-items: center; min-height: 56px; border-top: 1px solid #EEF0F3; }
  .pr > s { position: absolute; inset: 4px -14px; border-radius: 10px; background: rgba(17,60,123,.07); opacity: 0; }
  .pr > span { position: relative; width: 96px; flex: none; font: 500 18px Inter; color: var(--ink2); }
  .pr > div { position: relative; display: flex; gap: 8px; }
  .tag { font: 500 16px/1 'JetBrains Mono'; font-style: normal; color: var(--acc); background: #EEF2F8; border-radius: 8px; padding: 9px 11px; opacity: 0; }
  .qry { width: 880px; height: 240px; padding: 20px 26px; box-sizing: border-box; overflow: hidden; }
  .qt { margin: 0; font: 500 20px/33px 'JetBrains Mono'; color: var(--ink); }
  .pre { margin: 0; font: 500 17px/30px 'JetBrains Mono'; color: var(--teal); }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--ink); vertical-align: -4px; margin-left: 1px; }
  .model { width: 460px; height: 170px; box-sizing: border-box; padding: 24px 30px; border-radius: 18px; background: #17161A; color: #fff; }
  .model .cap { color: #6FD0D3; }
  .model b { display: block; font: 600 34px/1.1 Inter; letter-spacing: -0.02em; }
  .model span { display: block; margin-top: 12px; font: 500 16px 'JetBrains Mono'; color: #9AA3B5; }
  .vnum { font: 500 20px 'JetBrains Mono'; color: var(--ink2); white-space: nowrap; }
  .vlab { width: 300px; text-align: right; font: 500 18px Inter; color: var(--ink2); }
  .glab { width: 190px; text-align: right; font: 400 18px/22px Inter; color: var(--ink2); white-space: nowrap; }
  .glab b { color: var(--ink); font-weight: 600; margin-right: 8px; }
  .clab { font: 500 18px Inter; color: var(--ink2); white-space: nowrap; }
  .frame { width: 1240px; height: 600px; border-radius: 16px; background: #F1F2F4; box-shadow: 0 30px 80px rgba(30,24,36,.14); overflow: hidden; }
  .fbar { height: 44px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #E7E9EE; }
  .fbar i { width: 11px; height: 11px; border-radius: 50%; background: #E3E5EA; }
  .fbar span { margin-left: 16px; font: 500 15px Inter; color: #8A8F9C; background: #F3F4F6; padding: 6px 14px; border-radius: 8px; }
  .rrow { position: absolute; left: 0; width: 1200px; height: 44px; box-sizing: border-box; padding: 0 22px 0 64px; display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(20,19,22,.05), 0 6px 18px rgba(30,24,36,.05); }
  .rrow b { font: 600 19px Inter; white-space: nowrap; }
  .rrow > span { flex: 1; min-width: 0; font: 400 16px Inter; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .th { display: flex; gap: 16px; color: #8A8F9C; opacity: 0; }
  .th svg { width: 22px; height: 22px; display: block; }

  /* score */
  .fcard { width: 1200px; height: 92px; display: flex; align-items: center; justify-content: center; gap: 14px; font: 500 26px Inter; color: var(--ink); }
  .fcard > b { font-weight: 600; }
  .slot { position: relative; width: 150px; height: 56px; border-radius: 12px; border: 2px dashed #C9D1DE; box-sizing: border-box; }
  .slot em, .slot strong { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .slot em { font: 400 20px Inter; font-style: normal; color: var(--ink3); }
  .slot strong { font: 600 28px 'JetBrains Mono'; color: var(--acc); opacity: 0; }
  .slot u { position: absolute; left: 13px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; opacity: 0; }
  .tot { font: 600 30px 'JetBrains Mono'; color: var(--acc); opacity: 0; white-space: nowrap; }
  .comp p { margin: 0; white-space: nowrap; }
  .comp .lab { font: 500 19px Inter; color: var(--ink2); }
  .comp .big { font: 600 56px/1.1 'JetBrains Mono'; margin-top: 6px; }
  .comp .mid { font: 500 34px/1.2 'JetBrains Mono'; margin-top: 30px; }
  .comp .mid span { font: 400 18px Inter; color: var(--ink2); margin-left: 12px; }
  .comp .res { font: 600 64px/1.1 'JetBrains Mono'; color: var(--acc); margin-top: 30px; }
  .comp > * { opacity: 0; }
  .flyv { font: 600 28px 'JetBrains Mono'; color: var(--acc); z-index: 7; white-space: nowrap; }
  .rule { position: absolute; left: 0; width: 640px; height: 52px; box-sizing: border-box; padding: 0 16px 0 22px; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 12px; border: 1.5px solid transparent; box-shadow: 0 1px 2px rgba(20,19,22,.05), 0 6px 18px rgba(30,24,36,.05); font: 500 18px Inter; }
  .rule > span { flex: 1; white-space: nowrap; }
  .rule s { text-decoration: none; font: 600 12px/1 Inter; letter-spacing: 0.1em; color: var(--acc); background: #EEF2F8; padding: 7px 9px; border-radius: 6px; opacity: 0; }
  .rule b { font: 500 18px 'JetBrains Mono'; color: var(--ink3); width: 64px; text-align: right; }
  .rule i { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); display: flex; align-items: center; justify-content: center; opacity: 0; flex: none; }
  .meter { width: 420px; }
  .meter > p { margin: 0 0 16px; font: 500 19px Inter; color: var(--ink2); }
  .track { position: relative; height: 28px; border-radius: 14px; background: #E4E7EE; }
  .seg { position: absolute; top: 0; height: 28px; transform-origin: 0 50%; transform: scaleX(0); }
  .capl { position: absolute; right: -2px; top: -12px; width: 3px; height: 52px; border-radius: 2px; background: var(--ink); }
  .capt { position: absolute; right: -2px; top: -40px; font: 500 16px Inter; color: var(--ink2); white-space: nowrap; }
  .mval { margin-top: 34px; font: 600 64px/1 'JetBrains Mono'; color: var(--acc); }
  .mval span { opacity: 0; }
  .bk { position: absolute; left: 0; width: 440px; height: 52px; box-sizing: border-box; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 12px; border: 1.5px solid transparent; box-shadow: 0 1px 2px rgba(20,19,22,.05), 0 6px 18px rgba(30,24,36,.05); font: 500 18px Inter; color: var(--ink2); }
  .bk b { font: 600 20px 'JetBrains Mono'; color: var(--ink); }
  .prods p { margin: 0 0 20px; font: 500 30px/1.2 'JetBrains Mono'; display: flex; align-items: center; gap: 16px; white-space: nowrap; opacity: 0; }
  .prods i { width: 16px; height: 16px; border-radius: 4px; }
  .prods b { color: var(--acc); }
  .sbar { width: 1120px; height: 44px; border-radius: 12px; background: #E4E7EE; position: relative; overflow: hidden; }
  .sseg { position: absolute; top: 0; height: 100%; transform-origin: 0 50%; transform: scaleX(0); }
  .tick { position: absolute; top: 0; width: 2px; height: 16px; background: #B5BCC9; }
  .tickl { position: absolute; top: 24px; font: 500 17px Inter; color: var(--ink2); white-space: nowrap; transform: translateX(-50%); }
  .mark { font: 600 26px 'JetBrains Mono'; color: var(--acc); white-space: nowrap; }
  .badge { font: 600 18px/1 Inter; color: #fff; background: var(--acc); padding: 11px 16px; border-radius: 22px; white-space: nowrap; }

  /* etl */
  .tbl { width: 1200px; height: 560px; overflow: hidden; }
  .thd { position: relative; z-index: 2; height: 48px; display: flex; align-items: center; padding: 0 24px; background: #F6F7F9; font: 600 13px Inter; letter-spacing: 0.12em; color: var(--ink3); border-radius: 18px 18px 0 0; }
  .tb { position: absolute; left: 0; top: 48px; width: 1200px; }
  .tr { position: relative; height: 50px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #EEF0F3; font: 400 16px Inter; color: var(--ink2); box-sizing: border-box; }
  .tr > s { position: absolute; inset: 0; background: rgba(17,60,123,.08); border-left: 4px solid var(--acc); opacity: 0; }
  .tr > span, .thd > span { position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; box-sizing: border-box; flex: none; }
  .c1 { width: 270px; } .tr .c1 { font-weight: 600; color: var(--ink); } .c2 { width: 500px; } .c3 { width: 190px; } .c4 { width: 122px; } .c5 { width: 70px; }
  .raw { width: 1200px; box-sizing: border-box; padding: 22px 30px 24px; }
  .raw .t { margin: 0; font: 400 18px/1.65 Inter; color: var(--ink2); }
  .sec { border-radius: 5px; padding: 2px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sec b { color: var(--acc); font-weight: 600; }
  .lab2 { width: 1200px; box-sizing: border-box; padding: 20px 30px; }
  .ln { display: flex; align-items: center; gap: 16px; height: 36px; opacity: 0; }
  .ln em { flex: none; width: 150px; font: 500 15px 'JetBrains Mono'; font-style: normal; color: var(--acc); background: #EEF2F8; border-radius: 7px; padding: 6px 10px; box-sizing: border-box; }
  .ln span { flex: 1; min-width: 0; font: 400 18px Inter; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { width: 78px; height: 54px; border-radius: 9px; background: #fff; box-shadow: 0 4px 12px rgba(30,24,36,.08); padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; }
  .mini i { display: block; height: 5px; border-radius: 3px; background: #DCE2EC; }
  .mini i:first-child { width: 60%; background: #9FB3D6; }
  .mini.hl { box-shadow: 0 0 0 2px var(--teal), 0 4px 12px rgba(30,24,36,.08); }
  .model.sm { width: 300px; height: 180px; }
  .cnt { width: 300px; text-align: center; font: 500 19px 'JetBrains Mono'; color: var(--ink2); }
  .axl { font: 500 17px Inter; color: var(--ink2); white-space: nowrap; }
  .call { font: 600 16px/1 Inter; color: #fff; background: var(--acc); padding: 9px 13px; border-radius: 8px; white-space: nowrap; }
  #clipFade, #cursor, .ring { pointer-events: none; }
  .nextb { position: absolute; right: 120px; top: 73px; z-index: 7; display: none; align-items: center; gap: 10px; height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid var(--acc); background: #fff; color: var(--acc); font: 600 17px/38px Inter, sans-serif; white-space: nowrap; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .nextb:hover { background: var(--acc); color: #fff; }
  .live body { background: #fff; overflow: hidden; }
  .live #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .live .nextb { display: flex; }
  .live .pill { cursor: pointer; }
  .live .pill:hover { box-shadow: 0 0 0 2px rgba(122,74,28,.25); }
  .pill:focus-visible, .nextb:focus-visible, .mbar button:focus-visible { outline: 3px solid rgba(176,120,63,.7); outline-offset: 2px; }
  .mbar { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 639px) {
    .live .nextb { display: none; }
    .live .mbar { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 60px; font: 500 14px Inter, sans-serif; color: var(--ink2); }
    .mbar button { height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid rgba(122,74,28,.35); background: #fff; color: var(--acc); font: 600 14px Inter, sans-serif; cursor: pointer; }
    .mbar button:disabled { opacity: 0.35; cursor: default; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="bgfill"></div>
  <div id="rail"></div>
  <div id="heads"></div>
  <canvas id="cv"></canvas>
  <svg id="cursor" viewBox="0 0 22 22"><path d="M3 2 L3 18 L7.2 14.2 L10 20.4 L12.9 19.1 L10.2 13 L16 13 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div class="ring" id="click"></div>
  <div id="clipFade" class="bgfill" style="opacity:0"></div>
  <button class="nextb" id="nextb" type="button"><span id="nextl">Next</span><b aria-hidden="true">&rarr;</b></button>
</div>
<div class="mbar" id="mbar"><button type="button" id="mbPrev">Back</button><span id="mbLab"></span><button type="button" id="mbNext">Next</button></div>
<p class="sr" id="say" aria-live="polite"></p>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: k => k, out3: k => 1 - Math.pow(1 - k, 3), out5: k => 1 - Math.pow(1 - k, 5),
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k), in3: k => k * k * k,
  io3: k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  io5: k => k < 0.5 ? 16 * k ** 5 : 1 - Math.pow(-2 * k + 2, 5) / 2,
  back: k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
};
const P = (t, a, b, e = E.out3) => e(clamp((t - a) / (b - a)));
const win = (t, a, b, c, d) => P(t, a, b) * (1 - P(t, c, d, E.io3));
const show = (el, on) => { const v = on ? '' : 'none'; if (el.style.display !== v) el.style.display = v; };
const QS = new URLSearchParams(location.search);
const LIVE = !QS.has('clip');
const CLIP = QS.get('clip') || QS.get('x') || 'session';
const stage = $('stage');
function mk(html, parent = stage) { const t = document.createElement('template'); t.innerHTML = html.trim(); const el = t.content.firstChild; parent.appendChild(el); return el; }
function put(el, x, y, s = 1, op = 1) { show(el, op > 0.002); el.style.opacity = op; el.style.transform = `translate(${x}px, ${y}px) scale(${s})`; }
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, k) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; };
const rectOf = el => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; };
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* canvas */
const cv = $('cv'), ctx = cv.getContext('2d'); const DPR = window.devicePixelRatio || 1;
cv.width = Math.round(1440 * DPR); cv.height = Math.round(900 * DPR);
function clearC() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, 1440, 900); }
function dot(x, y, r, col, a) { if (a <= 0.005 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function heat(v) { const lim = 0.06, a = Math.pow(Math.min(1, Math.abs(v) / lim), 0.8); const m = [244, 245, 248], c = v >= 0 ? [17, 60, 123] : [22, 163, 168]; return `rgb(${m.map((x, i) => Math.round(x + (c[i] - x) * a)).join(',')})`; }

/* headings, rail */
function words(t) { return t.split(' ').map(w => `<span class="w"><span>${w}</span></span>`).join(' '); }
let STEPS = [], PILLS = [];
function mkHeads(steps, top) {
  $('heads').style.top = top + 'px';
  steps.forEach(s => { s.d = mk(`<div class="head"><h1>${words(s.h)}</h1><p>${words(s.n)}</p></div>`, $('heads')); s.ws = [...s.d.querySelectorAll('.w > span')]; });
  STEPS = steps;
}
function renderHeads(u) {
  STEPS.forEach((s, i) => {
    const tin = s.tin ?? (s.t0 + (i === 0 ? 0.3 : 0.06)), tout = i === STEPS.length - 1 ? 1e9 : (s.tout ?? s.t1 - 0.5);
    const on = u > tin - 0.02 && u < tout + 0.75; show(s.d, on); if (!on) return;
    s.ws.forEach((w, j) => {
      const kin = P(u, tin + j * 0.035, tin + j * 0.035 + 0.7, E.outExpo);
      const kout = P(u, tout + j * 0.01, tout + j * 0.01 + 0.36, E.in3);
      w.style.transform = `translateY(${(1 - kin) * 110 - kout * 110}%)`;
    });
  });
}
function mkRail(groups) {
  groups.forEach(g => { const G = mk(`<div class="grp"><i>${g.label}</i><div></div></div>`, $('rail')); g.items.forEach(it => PILLS.push(mk(`<button type="button" class="pill"><b></b><span>${it}</span></button>`, G.lastChild))); });
}
function renderRail(u) {
  $('rail').style.opacity = P(u, 0.1, 0.45); $('nextb').style.opacity = P(u, 0.1, 0.45);
  PILLS.forEach((p, i) => {
    const s = STEPS[i]; const done = u >= s.t1 - 0.02;
    const k = P(u, s.t0 - 0.1, s.t0 + 0.2) * (1 - P(u, s.t1 - 0.1, s.t1 + 0.2));
    const base = done ? '#7A4A1C' : '#9A9087';
    p.firstChild.style.opacity = k; p.lastChild.style.color = mixc(base, '#ffffff', k);
    p.style.borderColor = done ? 'rgba(122,74,28,.45)' : 'rgba(122,74,28,.18)';
  });
}

/* cursor */

  });

/* =================== sequencer =================== */
const CLIPS = {
  session: { build: buildSession, measure: () => {}, render: rSession, dur: 16.5, blur: [] },
  vision: { build: buildVision, measure: () => {}, render: rVision, dur: 18.9, blur: [] },
  safety: { build: buildSafety, measure: () => {}, render: rSafety, dur: 16.1, blur: [] },
};
const C = CLIPS[CLIP];
let DURATION = C.dur;
C.build();
window.render = function (T) {
  T = Math.max(0, Math.min(DURATION - 1e-4, T));
  C.render(T);
  $('clipFade').style.opacity = LIVE ? 0 : Math.max(1 - P(T, 0, 0.35, E.io3), P(T, DURATION - 0.35, DURATION, E.io3));
};
window.blurAt = T => (C.blur.some(([a, b]) => T >= a && T <= b) ? 1 : 0);
const fontLoads = ['400 20px Inter', '500 20px Inter', '600 20px Inter', 'italic 600 24px Inter', '400 20px "JetBrains Mono"', '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"'].map(f => document.fonts.load(f));
window.ready = Promise.all([...fontLoads, document.fonts.ready, ...Array.from(document.images).map(i => i.decode().catch(() => {}))])
  .then(() => document.fonts.ready).then(() => { C.measure(); window.render(0); if (LIVE) setupLive(); return true; });

/* =================== live mode: the reader moves through the steps =================== */
let XP_WANT = false, XP_GO = null;
window.xpStart = () => { XP_WANT = true; if (XP_GO) XP_GO(); };   // called by the page when this comes into view
const HOLDS = { session: [2.9, 5.3, 7.5, 11.4, 13.3, 16.3], vision: [2.7, 5.3, 7.7, 10.1, 12.5, 15.95, 18.7], safety: [2.3, 4.3, 6.1, 7.9, 9.7, 11.5, 13.3, 15.9] };
function setupLive() {
  document.documentElement.classList.add('live');
  const H = HOLDS[CLIP], n = H.length, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  STEPS.forEach((s, i) => { if (i < n - 1) s.tout = H[i]; if (i > 0) s.tin = Math.max(s.t0 + 0.06, H[i - 1] + 0.45); });
  const names = PILLS.map(p => p.textContent);
  let tNow = 0, queue = [], raf = 0, last = 0, target = -1;
  const ui = i => {
    PILLS.forEach((p, j) => { if (j === i) p.setAttribute('aria-current', 'step'); else p.removeAttribute('aria-current'); });
    const end = i >= n - 1;
    $('nextl').textContent = end ? 'Replay' : 'Next: ' + names[i + 1];
    $('nextb').querySelector('b').innerHTML = end ? '&#8635;' : '&rarr;';
    $('mbLab').textContent = `${i + 1} of ${n} \u00b7 ${names[i]}`;
    $('mbNext').textContent = end ? 'Replay' : 'Next';
    $('mbPrev').disabled = i <= 0;
  };
  const settle = () => { const s = STEPS[target]; $('say').textContent = `${s.h}. ${s.n}`; };
  const frame = () => {
    const now = performance.now(), dt = clamp((now - last) / 1000, 0, 0.05); last = now;
    const [to, sp] = queue[0], d = to - tNow, mv = sp * dt;
    if (Math.abs(d) <= mv) { tNow = to; queue.shift(); } else tNow += Math.sign(d) * mv;
    window.render(tNow);
    if (queue.length) raf = requestAnimationFrame(frame); else { raf = 0; settle(); }
  };
  const go = i => {
    if (i < 0 || i >= n) return;
    const prev = i === 0 ? 0 : H[i - 1], q = [];
    if (tNow > prev + 0.01) { tNow = prev; window.render(tNow); }                  // back, or replaying: cut to just before the step
    else if (tNow < prev - 0.01) q.push([prev, Math.max(3, (prev - tNow) / 0.9)]); // skipping ahead: fast-forward
    q.push([H[i], 0.6]);
    target = i; ui(i);
    if (reduce) { tNow = H[i]; queue = []; window.render(tNow); settle(); return; }
    queue = q;
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  };
  const next = () => go(target >= n - 1 ? 0 : target + 1);
  PILLS.forEach((p, i) => p.addEventListener('click', () => go(i)));
  $('nextb').addEventListener('click', next);
  $('mbNext').addEventListener('click', next);
  $('mbPrev').addEventListener('click', () => go(target - 1));
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') go(target - 1); });
  ui(0);
  const fit = () => {
    const s = document.documentElement.clientWidth / 1440;
    $('stage').style.transform = `scale(${s})`;
    const mb = $('mbar'); mb.style.top = 900 * s + 'px';
    const h = 900 * s + (getComputedStyle(mb).display === 'none' ? 0 : mb.offsetHeight);
    document.body.style.height = h + 'px';
    if (window.frameElement) window.frameElement.style.height = Math.ceil(h) + 'px';
  };
  addEventListener('resize', fit); fit();
  // the first step plays once the walkthrough is on screen, then it waits for the reader
  XP_GO = () => { if (target < 0) go(0); };
  if (XP_WANT) XP_GO();
  // fallback when opened on its own
  const io = new IntersectionObserver(es => { if (es.some(e => e.intersectionRatio >= 0.4)) { io.disconnect(); XP_GO(); } }, { threshold: [0, 0.4, 0.6, 1] });
  io.observe(document.body);
}
